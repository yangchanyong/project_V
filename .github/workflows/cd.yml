name: CD — Deploy to EC2
# trigger

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'Dockerfile'
      - '.github/workflows/cd.yml'
  workflow_dispatch:

permissions:
  id-token: write   # GitHub OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production   # 수동 승인 게이트

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Build JAR (skip tests)
        run: ./gradlew build -x test --no-daemon

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "$SSH_KEY" > /tmp/deploy_key && chmod 600 /tmp/deploy_key
          scp -i /tmp/deploy_key -o StrictHostKeyChecking=no \
            build/libs/*.jar Dockerfile \
            $EC2_USER@$EC2_HOST:/home/$EC2_USER/app/
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no \
            $EC2_USER@$EC2_HOST "bash /home/$EC2_USER/app/deploy.sh"
