# Project V — ARK 운영 Compose
#
# ark-internal 네트워크에서만 동작한다. Host port publish 없음, ark-public 직접 연결 없음.
# Nginx는 ark-internal을 경유해 이 컨테이너에 접근한다. DB/Object Storage도 ark-internal에서 접근한다.
#
# 환경변수는 값을 담지 않고 참조만 한다. 실제 값은 배포 서버의 .env(gitignore 대상, 이 저장소에 없음)에서 주입된다.
# 외부 PostgreSQL/Object Storage 컨테이너는 이 서비스가 관리하는 대상이 아니므로 depends_on을 걸지 않는다.

services:
  ark-project-v:
    image: ${ARK_PROJECT_V_IMAGE}
    container_name: ark-project-v
    restart: unless-stopped
    networks:
      - ark-internal
    environment:
      SPRING_PROFILES_ACTIVE: prod

      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}

      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET}

      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_PRESIGN_ENDPOINT: ${S3_PRESIGN_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}

networks:
  ark-internal:
    external: true
