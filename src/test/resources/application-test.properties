# CI / 테스트 전용 stub 설정 — 실제 외부 서비스 연결 없음

# DB: Local은 @DynamicPropertySource가 Testcontainers PostgreSQL을 기동, GitLab CI는 SPRING_DATASOURCE_* env로 postgres:17 service 사용

# JWT (테스트용 더미 키 — 운영 키와 무관)
app.jwt.secret=Y2ktdGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItdW5pdC10ZXN0aW5nLW9ubHk=
app.jwt.access-token-expiration-ms=3600000
app.jwt.refresh-token-expiration-ms=1209600000

# OAuth2 — 컨텍스트 로딩용 stub (실제 로그인 불가)
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.registration.google.scope=openid,email,profile

# S3-Compatible Object Storage — 컨텍스트 로딩용 stub (실제 외부 연결 없음)
# endpoint/presign-endpoint는 Spring Context 로딩과 S3Client/S3Presigner 빈 생성이 성공하도록
# 형식만 유효한 dummy URL을 넣는다. 테스트는 실제 네트워크를 타지 않음
aws.region=us-east-1
aws.s3.bucket=test-bucket
aws.s3.endpoint=http://localhost:9000
aws.s3.presign-endpoint=http://localhost:9000
aws.s3.path-style-access=true
aws.credentials.access-key=test-access-key
aws.credentials.secret-key=test-secret-key
