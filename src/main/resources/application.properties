spring.application.name=gunpla

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# Flyway
# Why: PostgreSQL 전환 후 vendor별 분리 — 기본 위치를 postgresql 하위로 지정
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/postgresql

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator — ARK deploy-compose 템플릿의 헬스체크(/actuator/health)만 노출
# Why: health 외 endpoint(env, beans 등) 의도치 않은 외부 노출 방지, 응답 상세 정보는 비공개 유지
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
