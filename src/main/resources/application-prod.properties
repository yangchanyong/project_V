# ------------------------------------------------------------
# Database (PostgreSQL — 최종 배포 대상 ARK)
# 운영 DB 연결값은 환경변수(DB_URL/DB_USERNAME/DB_PASSWORD)로 외부 주입
# Why: Aurora MySQL 전제 폐기 후 PostgreSQL로 전환. ARK 운영 DB 확정 전까지 URL은 env에 위임
# ------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ------------------------------------------------------------
# JWT
# ------------------------------------------------------------
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration-ms=3600000
app.jwt.refresh-token-expiration-ms=1209600000

# ------------------------------------------------------------
# OAuth2 — Google
# ------------------------------------------------------------
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google
spring.security.oauth2.client.registration.google.scope=openid,email,profile

# ------------------------------------------------------------
# OAuth2 — Kakao
# ------------------------------------------------------------
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/kakao
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,account_email
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# ------------------------------------------------------------
# OAuth2 — Naver
# ------------------------------------------------------------
spring.security.oauth2.client.registration.naver.client-id=${NAVER_CLIENT_ID}
spring.security.oauth2.client.registration.naver.client-secret=${NAVER_CLIENT_SECRET}
spring.security.oauth2.client.registration.naver.redirect-uri={baseUrl}/login/oauth2/code/naver
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.scope=name,email,profile_image
spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response

# ------------------------------------------------------------
# S3-Compatible Object Storage (ARK — MinIO AIStor)
# Why: AWS S3 종속을 걷어내고 ARK 내부 MinIO로 이관.
#   - endpoint          : 서버 내부 S3 API 통신용 (예: http://ark-object-storage:9000)
#   - presign-endpoint  : 클라이언트가 Presigned URL로 접근할 외부 공개 도메인
#                         내부 hostname이 URL에 유출되지 않도록 반드시 분리 주입
#   - path-style-access : MinIO 등 S3-compatible 백엔드는 virtual-hosted-style 미지원 → true 고정
# 환경변수 이름은 AWS 종속 이름(AWS_*)에서 S3 역할 중심(S3_*)으로 정리
# ------------------------------------------------------------
aws.region=${S3_REGION:us-east-1}
aws.s3.bucket=${S3_BUCKET}
aws.s3.endpoint=${S3_ENDPOINT}
aws.s3.presign-endpoint=${S3_PRESIGN_ENDPOINT}
aws.s3.path-style-access=true
aws.credentials.access-key=${S3_ACCESS_KEY}
aws.credentials.secret-key=${S3_SECRET_KEY}

# ------------------------------------------------------------
# Reverse Proxy (Cloudflare → nginx → Spring Boot)
# X-Forwarded-Proto 헤더 신뢰: OAuth2 redirect_uri가 HTTPS로 생성되도록
# ------------------------------------------------------------
server.forward-headers-strategy=framework

# ------------------------------------------------------------
# CORS / OAuth2 redirect
# ------------------------------------------------------------
app.cors.allowed-origins=https://vibe.chanyongyang.com
app.oauth2.redirect-url=https://vibe.chanyongyang.com/swagger-ui/index.html

# ------------------------------------------------------------
# Flyway — seed 제외 (운영에서는 migration만), PostgreSQL vendor 경로 사용
# ------------------------------------------------------------
spring.flyway.locations=classpath:db/migration/postgresql
